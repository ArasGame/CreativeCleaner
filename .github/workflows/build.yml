name: Build CreativeCleaner

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract ZIP
        run: |
          mkdir project
          unzip -o *.zip -d project
          echo "ZIP içindəkilər:"
          find project -maxdepth 3 -type f

      - name: Build
        working-directory: project
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew build
          elif [ -f ./build.gradle ]; then
            gradle build
          else
            echo "build.gradle və ya gradlew tapılmadı!"
            exit 1
          fi

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: CreativeCleaner-JAR
          path: |
            project/**/build/libs/*.jar
